name: package-trial

on:
  push:
    branches:
      - feature/v1.9-model-calibration
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build trial ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package GPT_AI_Inspection 'GPT AI Inspection.zip'
          mkdir -p GPT_AI_Inspection
          rsync -a \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='package/' \
            --exclude='GPT_AI_Inspection/' \
            --exclude='GPT AI Inspection.zip' \
            ./ GPT_AI_Inspection/
          test -f GPT_AI_Inspection/TEST_REAL_PCB.md
          zip -qr 'GPT AI Inspection.zip' GPT_AI_Inspection
          test -s 'GPT AI Inspection.zip'
          unzip -tq 'GPT AI Inspection.zip'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: GPT_AI_Inspection
          path: 'GPT AI Inspection.zip'
          if-no-files-found: error
          retention-days: 30
